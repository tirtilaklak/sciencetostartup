name: Browser QA
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  browser-core:
    # Keep the browser/performance host stable across ubuntu-latest migrations.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:f6fe3cf9a493670b9a20f33597a807262abb25c40c31839ba4ac1dbc51fe7366
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Trust the checked-out workspace in the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Align the temporary home directory with the container user
        run: chown --reference=/proc/self "$HOME"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify committed artifact before browser tests
        env:
          PYTHONPATH: scripts
        run: python3 -c 'from pathlib import Path; from release_artifact import validate_artifact; validate_artifact(Path("dist"))'
      - run: npm run test:browser -- --grep-invert 'no serious or critical accessibility violations on /research/state-of-ai-data-labs/($|chapters/)'
        env:
          QA_DIST: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-core-qa
          path: output/browser-qa/
          retention-days: 14
  report-accessibility:
    # Give every complete report chapter a dedicated runner and unchanged scans.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:f6fe3cf9a493670b9a20f33597a807262abb25c40c31839ba4ac1dbc51fe7366
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Trust the checked-out workspace in the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Align the temporary home directory with the container user
        run: chown --reference=/proc/self "$HOME"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify committed artifact before browser tests
        env:
          PYTHONPATH: scripts
        run: python3 -c 'from pathlib import Path; from release_artifact import validate_artifact; validate_artifact(Path("dist"))'
      - run: npm run test:browser -- --grep 'no serious or critical accessibility violations on /research/state-of-ai-data-labs/($|chapters/)' --workers=1
        env:
          QA_DIST: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-accessibility-qa
          path: output/browser-qa/
          retention-days: 14
  browser:
    # Preserve the required check, including failures, cancellations and skips.
    if: ${{ always() }}
    needs: [browser-core, report-accessibility, performance]
    runs-on: ubuntu-24.04
    steps:
      - name: Require browser, accessibility and performance checks to pass
        env:
          CORE_RESULT: ${{ needs.browser-core.result }}
          REPORT_RESULT: ${{ needs.report-accessibility.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
        run: |
          test "$CORE_RESULT" = success
          test "$REPORT_RESULT" = success
          test "$PERFORMANCE_RESULT" = success
  performance:
    # Keep the browser/performance host stable across ubuntu-latest migrations.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 scripts/build_public_snapshot.py --verify
      - name: Serve the exact artifact with gzip
        run: |
          python3 scripts/preview_server.py --directory dist --port 18770 > /tmp/static-preview.log 2>&1 &
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(50):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18770/manifest.json') as response:
                      assert response.status == 200
                  break
              except OSError:
                  if attempt == 49: raise
                  time.sleep(.2)
          PY
      - name: Three pinned mobile audits on field-guide and research routes
        run: node scripts/performance_audit.mjs --base-url http://127.0.0.1:18770 --dist dist --runs 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-performance
          path: output/performance/
          retention-days: 14
