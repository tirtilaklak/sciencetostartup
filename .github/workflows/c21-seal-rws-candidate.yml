name: Seal the verified RWS and site reliability release
on:
  push:
    branches: [codex/site-quality-c21-hosted-recovery-20261122]
    paths: [.github/workflows/c21-seal-rws-candidate.yml]
permissions:
  contents: read
  actions: read
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      C21_HEAD: eae4770118a9ffb35279c71f4bef061b302e89d7
      C21_SOURCE: 3dc00346d6791920535ecca7df608e35a3aee9e6
      C21_INITIAL: fa24bac625b428bf868b2d5259f2837eef6023b5
      C21_DIST_TREE: d47311a994be269c78e4ae4365977fe15e7699b5
      C21_MANIFEST: ea4fa51e30eea853e7526bdd62b0117c36c7532da0cb8f471beffd21708a1c45
    steps:
      - name: Confirm exact official and independent gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in 45113777996 45113777911; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)" = "$C21_HEAD"
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)" = success
          done
          for run in 45113793373 45113838865 45113896185 45113518985; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)" = success
          done
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45113793373
          pattern: c21-rws-final-exact-*
          path: output/proof/core
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45113838865
          pattern: c21-rws-final-explore-*
          path: output/proof/explore
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45113896185
          name: c21-rws-final-history-control
          path: output/proof/history
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45113518985
          name: c21-rws-verified-signed
          path: output/proof/rws
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45113777911
          artifact-ids: 14791837047
          path: output/proof/performance
      - name: Validate actual receipts and prepare the exact provider asset pack
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/c21-product" "$C21_HEAD"
          cd "$RUNNER_TEMP/c21-product"
          PYTHONPATH=scripts python3 "$GITHUB_WORKSPACE/.github/qa/c21-recovery/seal_rws_candidate.py" "$GITHUB_WORKSPACE/output/proof" "$GITHUB_WORKSPACE/output/ready"
          python3 -c "import json; print(json.load(open('$GITHUB_WORKSPACE/output/ready/release-ready.json'))['plan_sha256'])"
      - uses: actions/upload-artifact@v4
        with:
          name: c21-rws-release-ready
          path: output/ready
          if-no-files-found: error
          retention-days: 14
