name: Read the exact mobile failure receipt
on:
  push:
    branches: [codex/site-quality-c21-hosted-recovery-20261122]
    paths: [.github/workflows/c21-reader-mobile-receipt.yml]
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45109451088
          name: c21-reader-exact-mobile-chromium
          path: output
      - name: Keep the failed cases and browser stack visible
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('output/mobile-chromium')
          report=json.loads((root/'summary.json').read_bytes())
          for row in report['cases']:
              if not row['passed']:
                  print('FAILED CASE',json.dumps(row))
          raw=json.loads((root/'playwright.json').read_bytes())
          def bad(suite):
              for spec in suite.get('specs',[]):
                  for test in spec['tests']:
                      for result in test['results']:
                          if result['status']=='passed':
                              continue
                          for error in result.get('errors',[]) or [result.get('error',{})]:
                              print('BROWSER FAILURE',spec['title'],json.dumps(error))
              for nested in suite.get('suites',[]):
                  bad(nested)
          bad(raw)
          import zipfile
          for archive in (root/'results').rglob('trace.zip'):
              with zipfile.ZipFile(archive) as trace:
                  for name in trace.namelist():
                      if not name.endswith('.trace'):
                          continue
                      for line in trace.read(name).splitlines():
                          event=json.loads(line)
                          method=event.get('method','')
                          api=event.get('apiName','')
                          snap=event.get('snapshot',{})
                          if method in {'goto','press','goBack','waitForURL','expect'} or any(key in api for key in ('goto','goBack','press')):
                              print('TRACE CALL',json.dumps({field:event.get(field) for field in ('type','method','apiName','startTime','endTime','params','error','callId')}))
                          if event.get('type')=='frame-snapshot':
                              print('TRACE SNAPSHOT',json.dumps([snap.get('timestamp'),snap.get('snapshotName'),snap.get('frameUrl')]))
          PY
