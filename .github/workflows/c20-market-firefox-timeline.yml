name: C20 Market Firefox timeline
on:
  push:
    branches: [codex/site-quality-c20-market-firefox-timeline-20261122]
permissions:
  contents: read
jobs:
  market-timeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:f6fe3cf9a493670b9a20f33597a807262abb25c40c31839ba4ac1dbc51fe7366
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Use the repository browser environment
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chown --reference=/proc/self "$HOME"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Record ordinary Firefox Market reload against two immutable versions
        run: node .github/qa/c20-market-firefox/diagnose.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c20-market-firefox-timeline
          path: output/c20-market-firefox/
          if-no-files-found: error
          retention-days: 14
