name: Trace Firefox Market history
on:
  push:
    branches: [codex/site-quality-c21-hosted-recovery-20261122]
    paths: [.github/workflows/market-position-timeline.yml, .github/qa/c21-recovery/market_timeline.mjs]
permissions:
  contents: read
jobs:
  trace:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: live
            head: 2ded7d039d7605b113d1a8dac83af41dbcf3171b
            manifest: 1fe217bab088009c4fb30ca3b00987bc3291361808823d9c523729fb648015fc
            url: https://sciencetostartup.com
          - target: candidate
            head: 020d7f728c0a9ba0dbd4de699cb26bdc4ee665c6
            manifest: 4a743a78e1e7cbe76ca6b097cb9072b6aaa557f0892b9e734aeff10eb36a3103
            url: http://127.0.0.1:19011
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:f6fe3cf9a493670b9a20f33597a807262abb25c40c31839ba4ac1dbc51fe7366
      options: --init --ipc=host
    env:
      TARGET: ${{ matrix.target }}
      HEAD: ${{ matrix.head }}
      MANIFEST: ${{ matrix.manifest }}
      QA_BASE_URL: ${{ matrix.url }}
      MARKET_TRIALS: '16'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and trace the exact build
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chown --reference=/proc/self "$HOME"
          export PRODUCT_DIR="$RUNNER_TEMP/market-$TARGET"
          OUT="$GITHUB_WORKSPACE/output/$TARGET"
          mkdir -p "$OUT"
          export MARKET_TIMELINE_OUT="$OUT/timeline.json"
          git worktree add --detach "$PRODUCT_DIR" "$HEAD"
          git config --global --add safe.directory "$PRODUCT_DIR"
          cd "$PRODUCT_DIR"
          npm ci
          PYTHONPATH=scripts python3 - <<'PY'
          import os
          from pathlib import Path
          from release_artifact import validate_artifact
          validate_artifact(Path('dist'),os.environ['MANIFEST'])
          PY
          if [ "$TARGET" = candidate ]; then
            QA_DIST="$PWD/dist" python3 scripts/browser_qa_server.py --port 19011 > "$OUT/origin.log" 2>&1 &
            origin_pid=$!
            trap 'kill "$origin_pid" 2>/dev/null || true' EXIT
          fi
          for attempt in $(seq 1 15); do
            curl --silent --fail "$QA_BASE_URL/manifest.json" --output "$OUT/manifest-before.json" && break
            sleep 1
          done
          cmp "$OUT/manifest-before.json" dist/manifest.json
          node "$GITHUB_WORKSPACE/.github/qa/c21-recovery/market_timeline.mjs"
          curl --silent --show-error --fail "$QA_BASE_URL/manifest.json" --output "$OUT/manifest-after.json"
          cmp "$OUT/manifest-after.json" dist/manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-position-${{ matrix.target }}
          path: output/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
