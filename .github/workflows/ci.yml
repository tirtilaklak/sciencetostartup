name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Public snapshot reproduces the checked-in dist
        run: python3 scripts/build_public_snapshot.py --verify
      - name: JS logic checks
        run: |
          python3 tests/js_logic.py
          python3 tests/company_search_prefix_logic.py
